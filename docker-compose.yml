services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: heladeria
      POSTGRES_PASSWORD: heladeria
      POSTGRES_DB: heladeria
    ports:
      - "${DB_PORT:-5432}:5432" # DB_PORT en .env si ya tienes otro Postgres en el 5432
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U heladeria"]
      interval: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://heladeria:heladeria@db:5432/heladeria
    ports:
      - "8000:8000"
    volumes:
      # Seeds del host sobre los de la imagen: permite usar seeds/heladeria.json
      # (SEED_FILE=seeds/heladeria.json en .env) sin meterlo nunca en la imagen.
      - ./seeds:/app/seeds:ro
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
